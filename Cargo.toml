[package]
name = "gedcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Browse, check and edit GEDCOM family trees: a terminal UI, ancestor and descendant trees and charts, relationship names, data checks, file comparison and HTML export"
license = "GPL-3.0-or-later"
repository = "https://github.com/oroulet/gedcli"
readme = "README.md"
keywords = ["gedcom", "genealogy", "family-tree", "tui", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = [".gitattributes", "comments.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16"
crossterm = "0.29"
deunicode = "1.6.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
gedcomkit = { version = "0.1.19", features = ["serde"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termtree = "1.0.0"
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
