[package]
name = "gedcli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
deunicode = "1.6.2"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
gedcomkit = { version = "0.1.19", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termtree = "1.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
