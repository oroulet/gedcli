<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f7f6f3; --fg: #222; --muted: #777; --line: #b9b4aa; --card: #fff;
  --male: #2f80ed; --female: #e0569b; --other: #9a958c; --hit: #ffe28a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1b1d; --fg: #eee; --muted: #9a9a9a; --line: #555; --card: #26262a;
          --male: #5aa2ff; --female: #ff7dbd; --other: #888; --hit: #6b5a12; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.35 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
         padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
input[type=search] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
#viewport { overflow: auto; height: calc(100vh - 54px); }
#canvas { transform-origin: top left; padding: 24px; width: max-content; }
section + section { margin-top: 0; }
.tree ul { position: relative; display: flex; justify-content: center; padding: 20px 0 0; margin: 0; }
.tree li { list-style: none; position: relative; padding: 20px 4px 0; display: flex; flex-direction: column; align-items: center; }
.tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; width: 50%; height: 20px; border-top: 1px solid var(--line); }
.tree li::after { right: auto; left: 50%; border-left: 1px solid var(--line); }
.tree li:only-child::before, .tree li:only-child::after { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 1px solid var(--line); border-radius: 0 6px 0 0; }
.tree li:first-child::after { border-radius: 6px 0 0 0; }
.tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; height: 20px; border-left: 1px solid var(--line); }
.tree > ul { padding-top: 0; }
.up { transform: scaleY(-1); }
.up .card { transform: scaleY(-1); }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--other); border-radius: 6px;
        padding: 6px 10px; min-width: 120px; max-width: 190px; text-align: center; cursor: pointer; }
.card.M { border-top-color: var(--male); }
.card.F { border-top-color: var(--female); }
.card.union { border-style: dashed; border-top-width: 1px; min-width: 0; color: var(--muted); }
.card .name { font-weight: 600; }
.card .life, .card .id, .card .partner { color: var(--muted); font-size: 12px; }
.card .partner { margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
.card.repeat { opacity: .6; }
body:not(.ids) .card .id { display: none; }
.joined .tree.up > ul > li > .card { display: none; }
.card.hit { background: var(--hit); }
li.collapsed > ul { display: none; }
li.collapsed > .card::after { content: ' ▸'; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <label>Zoom <input id="zoom" type="range" min="0.3" max="1.5" step="0.05" value="1"></label>
  <label>Find <input id="find" type="search" placeholder="name…"></label>
  <label><input id="ids" type="checkbox"> show ids</label>
  <span style="color:var(--muted)">click a card to fold its branch</span>
</header>
<div id="viewport"><div id="canvas"></div></div>
<script>
const DATA = __DATA__;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function card(person, repeat, partner) {
  const c = el('div', 'card ' + (person.sex || 'U') + (repeat ? ' repeat' : ''));
  c.append(el('div', 'name', (repeat ? '↺ ' : '') + person.name));
  if (person.life) c.append(el('div', 'life', person.life));
  c.append(el('div', 'id', person.id));
  if (partner) c.append(el('div', 'partner', '∞ ' + partner.name + (partner.life ? ' (' + partner.life + ')' : '')));
  c.dataset.search = fold(person.name + ' ' + (partner ? partner.name : ''));
  return c;
}

function branch(items) {
  const ul = el('ul');
  items.forEach(i => ul.append(i));
  return ul;
}

function foldable(li, kids) {
  if (!kids.length) return;
  li.append(branch(kids));
  li.firstChild.addEventListener('click', () => li.classList.toggle('collapsed'));
}

function ancestor(rel) {
  const li = el('li');
  li.append(card(rel, rel.repeat));
  foldable(li, (rel.parents || []).map(ancestor));
  return li;
}

function descendant(rel) {
  const li = el('li');
  const families = rel.families || [];
  if (families.length === 1) {
    li.append(card(rel, rel.repeat, families[0].partner));
    foldable(li, families[0].children.map(descendant));
  } else {
    li.append(card(rel, rel.repeat));
    foldable(li, families.map(f => {
      const u = el('li');
      const c = el('div', 'card union', '∞ ' + (f.partner ? f.partner.name : 'unknown partner'));
      c.dataset.search = fold(f.partner ? f.partner.name : '');
      u.append(c);
      foldable(u, f.children.map(descendant));
      return u;
    }));
  }
  return li;
}

function fold(text) {
  return text.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

const canvas = document.getElementById('canvas');
if (DATA.ancestors) {
  const s = el('section', 'tree up');
  s.append(branch([ancestor(DATA.ancestors)]));
  canvas.append(s);
}
if (DATA.descendants) {
  const s = el('section', 'tree');
  s.append(branch([descendant(DATA.descendants)]));
  canvas.append(s);
}

if (DATA.ancestors && DATA.descendants) canvas.classList.add('joined');
document.getElementById('ids').addEventListener('change', e => document.body.classList.toggle('ids', e.target.checked));

document.getElementById('zoom').addEventListener('input', e => {
  canvas.style.transform = 'scale(' + e.target.value + ')';
});

document.getElementById('find').addEventListener('input', e => {
  const q = fold(e.target.value.trim());
  let first = null;
  document.querySelectorAll('.card').forEach(c => {
    const hit = q.length > 1 && c.dataset.search.includes(q);
    c.classList.toggle('hit', hit);
    if (hit && !first) first = c;
  });
  if (first) first.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
});

window.addEventListener('load', () => {
  const root = document.querySelector('.tree:not(.up) > ul > li > .card') || document.querySelector('.tree > ul > li > .card');
  if (root) root.scrollIntoView({ block: 'center', inline: 'center' });
});
</script>
</body>
</html>
